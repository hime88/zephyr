            {n: "xdsize", d: "Calculates size in bytes of specified xdata list.", p: "Windows, Mac OS, Web", s: "(xdsize list)", r: "Integer", pr: "list: extended data list.", ex: "(xdsize '((1001. \"MY_APP\") (1000. \"DATA\")))"},

            // Z FUNCTIONS
            {n: "zerop", d: "Checks if numeric S-expression evaluates to zero.", p: "Windows, Mac OS, Web", s: "(zerop num)", r: "T or nil", pr: "num: Integer or Real value.", ex: "(zerop 0.0)\n;; Returns: T\n(zerop 5)\n;; Returns: nil"}
        ];

        // Initialize lists and render elements
        function initApp() {
            const listContainer = document.getElementById('function-list');
            listContainer.innerHTML = '';
            
            LISP_DB.forEach((item, index) => {
                const li = document.createElement('li');
                const a = document.createElement('a');
                a.href = '#';
                a.textContent = item.n;
                a.dataset.index = index;
                a.onclick = (e) => {
                    e.preventDefault();
                    document.querySelectorAll('#function-list a').forEach(el => el.classList.remove('active'));
                    a.classList.add('active');
                    displayCard(item);
                };
                li.appendChild(a);
                listContainer.appendChild(li);
            });
        }

        // Display card for the selected function
        function displayCard(f) {
            const display = document.getElementById('main-content');
            display.innerHTML = `
                <div class="function-card">
                    <div class="function-header">
                        <h3 class="function-name">${escapeHTML(f.n)}</h3>
                        <span class="platforms-tag">${f.p}</span>
                    </div>
                    <p>${escapeHTML(f.d)}</p>
                    <div class="section-label">Signature</div>
                    <div class="signature-box">${escapeHTML(f.s)}</div>
                    <div class="section-label">Parameters</div>
                    <div class="parameter-item">
                        <p>${escapeHTML(f.pr)}</p>
                    </div>
                    <div class="section-label">Return Value</div>
                    <p><strong>Type:</strong> ${escapeHTML(f.r)}</p>
                    <div class="section-label">Examples</div>
                    <div class="example-box">${escapeHTML(f.ex)}</div>
                </div>
            `;
        }

        // Quick escape utility for clean HTML rendering
        function escapeHTML(str) {
            if (!str) return '';
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        // Live filtering index engine
        function filterIndex() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const listContainer = document.getElementById('function-list');
            listContainer.innerHTML = '';

            const matches = LISP_DB.filter(item => 
                item.n.toLowerCase().includes(query) || 
                item.d.toLowerCase().includes(query)
            );

            matches.forEach((item) => {
                const li = document.createElement('li');
                const a = document.createElement('a');
                a.href = '#';
                a.textContent = item.n;
                a.onclick = (e) => {
                    e.preventDefault();
                    document.querySelectorAll('#function-list a').forEach(el => el.classList.remove('active'));
                    a.classList.add('active');
                    displayCard(item);
                };
                li.appendChild(a);
                listContainer.appendChild(li);
            });

            // If there's exact matches, automatically display first
            if (matches.length > 0) {
                displayCard(matches[0]); // Fixed passing an array to displayCard
            }
        }

        // Run application on load
        window.onload = initApp;
    </script>
